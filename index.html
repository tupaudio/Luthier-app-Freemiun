<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <title>Luthier de Bolso</title>
  </head>
  <body style="margin: 0; background-color: #0c0a09;">
    <div id="root">
      <div style="min-height: 100vh; background-color: #0c0a09; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #f5f5f4;">
        <div style="position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
          <img src="/icon.png" alt="Luthier de Bolso" style="width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 10px 30px rgba(245, 158, 11, 0.25); animation: pulseIcon 2s ease-in-out infinite;" />
        </div>
        <div style="font-size: 20px; font-weight: 800; letter-spacing: -0.5px; color: #fafaf9; margin-bottom: 6px;">Luthier de Bolso</div>
        <div style="font-size: 11px; font-weight: 600; color: #f59e0b; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 28px;">Tupã Áudio</div>
        <div style="width: 140px; height: 3px; background-color: #292524; border-radius: 9999px; overflow: hidden; position: relative;">
          <div style="width: 50%; height: 100%; background: linear-gradient(90deg, #d97706, #fbbf24); border-radius: 9999px; animation: progressAnim 1.4s ease-in-out infinite;"></div>
        </div>
      </div>
      <style>
        @keyframes pulseIcon {
          0%, 100% { transform: scale(1); opacity: 0.92; }
          50% { transform: scale(1.04); opacity: 1; filter: drop-shadow(0 0 16px rgba(245, 158, 11, 0.35)); }
        }
        @keyframes progressAnim {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(250%); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
